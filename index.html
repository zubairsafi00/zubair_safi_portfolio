    <script>
  (function (location) {
    if (location.search[1] === "/") {
      const decoded =
        location.search
          .slice(1)
          .split("&")
          .map((part) => part.replace(/~and~/g, "&"))
          .join("&");

      window.history.replaceState(
        null,
        "",
        location.pathname.replace(/\/$/, "") +
          decoded +
          location.hash
      );
    }
  })(window.location);
</script>
